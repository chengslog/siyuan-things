name: Release plugin

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths:
      - plugin.json
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: things-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches plugin version
        shell: bash
        run: |
          VERSION=$(node -p "require('./plugin.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            test "${GITHUB_REF_NAME}" = "v${VERSION}"
          fi
          echo "RELEASE_TAG=v${VERSION}" >> "$GITHUB_ENV"

      - name: Run core tests
        run: pnpm test

      - name: Build for production
        run: pnpm run build

      - name: Generate update metadata without REST API dependency
        run: node scripts/create_update_manifest.mjs

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const version = JSON.parse(fs.readFileSync('plugin.json', 'utf8')).version;
          const sections = fs.readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n(?=## )/);
          const notes = sections.find(section => section.split(/\r?\n/, 1)[0].includes(`v${version}`));
          if (!notes) throw new Error(`Missing changelog for v${version}`);
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'things-release-notes.md'), notes.trim() + '\n');
          NODE
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" package.zip update.json --clobber
            gh release edit "${RELEASE_TAG}" --latest --notes-file "$RUNNER_TEMP/things-release-notes.md"
          else
            gh release create "${RELEASE_TAG}" package.zip update.json \
              --target "${GITHUB_SHA}" \
              --title "${RELEASE_TAG}" \
              --latest \
              --notes-file "$RUNNER_TEMP/things-release-notes.md"
          fi
